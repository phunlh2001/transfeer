name: Release

# Publishes a GitHub Release (tag = v<version>, attachment = zip with the APK)
# whenever a new version reaches GitHub:
#   - push to main where pubspec.yaml has a version without a release yet, or
#   - push of a tag v* (must match the version in pubspec.yaml).
# Both paths skip if the release already exists, so pushing a commit and its
# tag together publishes only once.
#
# Required repository secrets (Settings > Secrets and variables > Actions):
#   ANDROID_KEYSTORE_BASE64   base64 of android/upload-keystore.jks
#   ANDROID_KEYSTORE_PASSWORD storePassword from android/key.properties
#   ANDROID_KEY_PASSWORD      keyPassword   from android/key.properties
#   ANDROID_KEY_ALIAS         keyAlias      from android/key.properties
on:
  push:
    branches: [main]
    paths: [pubspec.yaml]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - name: Read version from pubspec.yaml
        id: ver
        run: |
          full=$(grep -E '^version:' pubspec.yaml | head -1 | awk '{print $2}')
          version=${full%%+*}
          tag="v$version"
          echo "full=$full"       >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag"         >> "$GITHUB_OUTPUT"
          echo "pubspec version $full -> tag $tag"
          if [[ "$GITHUB_REF_TYPE" == "tag" && "$GITHUB_REF_NAME" != "$tag" ]]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match pubspec version ($tag). Bump pubspec.yaml first."
            exit 1
          fi

      - name: Skip if release already exists
        id: check
        run: |
          if gh release view "${{ steps.ver.outputs.tag }}" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release ${{ steps.ver.outputs.tag }} already exists - nothing to do."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-java@v4
        if: steps.check.outputs.skip == 'false'
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        if: steps.check.outputs.skip == 'false'
        with:
          channel: stable
          flutter-version: 3.41.7
          cache: true

      - name: Test
        if: steps.check.outputs.skip == 'false'
        run: |
          flutter pub get
          flutter analyze
          flutter test

      - name: Set up release signing
        if: steps.check.outputs.skip == 'false'
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          # Refuse to publish a debug-signed APK: installed apps could not update to it.
          if [[ -z "$KEYSTORE_BASE64" || -z "$STORE_PASSWORD" || -z "$KEY_PASSWORD" || -z "$KEY_ALIAS" ]]; then
            echo "::error::Signing secrets are missing (ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_PASSWORD, ANDROID_KEY_ALIAS)."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > android/upload-keystore.jks
          cat > android/key.properties <<PROPS
          storePassword=$STORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=../upload-keystore.jks
          PROPS

      - name: Build APK
        if: steps.check.outputs.skip == 'false'
        run: flutter build apk --release

      - name: Verify signature
        if: steps.check.outputs.skip == 'false'
        run: |
          apksigner=$(ls -d "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$apksigner" verify --print-certs build/app/outputs/flutter-apk/app-release.apk | tee certs.txt
          grep -q "CN=Transfeer" certs.txt || { echo "::error::APK is not signed with the release key"; exit 1; }

      - name: Zip APK
        if: steps.check.outputs.skip == 'false'
        id: zip
        run: |
          mkdir -p dist
          name="transfeer-${{ steps.ver.outputs.tag }}.zip"
          (cd build/app/outputs/flutter-apk && zip -9 "$GITHUB_WORKSPACE/dist/$name" app-release.apk)
          unzip -l "dist/$name"
          echo "path=dist/$name" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release
        if: steps.check.outputs.skip == 'false'
        run: |
          tag="${{ steps.ver.outputs.tag }}"
          notes_file=release-notes.md
          # Notes come from the tag annotation if present, otherwise a default (Vietnamese: shown in the app).
          if [[ "$GITHUB_REF_TYPE" == "tag" ]] && git fetch --depth=1 origin "+refs/tags/$tag:refs/tags/$tag" 2>/dev/null \
             && [[ "$(git cat-file -t "$tag")" == "tag" ]]; then
            git tag -l --format='%(contents)' "$tag" > "$notes_file"
          fi
          if [[ ! -s "$notes_file" ]]; then
            echo "Phiên bản ${{ steps.ver.outputs.version }}" > "$notes_file"
          fi
          gh release create "$tag" "${{ steps.zip.outputs.path }}" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Transfeer $tag" \
            --notes-file "$notes_file"

      - name: Clean up signing files
        if: always()
        run: rm -f android/upload-keystore.jks android/key.properties
