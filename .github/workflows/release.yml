name: Release

# Publishes a GitHub Release (tag = v<version>, attachment = zip with the APK)
# whenever a new version reaches GitHub:
#   - push to main where pubspec.yaml has a version without a release yet, or
#   - push of a tag v* (must match the version in pubspec.yaml).
# Both paths skip if the release already exists, so pushing a commit and its
# tag together publishes only once.
# No signing secrets: the APK is built with Flutter's default (debug) signing.
on:
  push:
    branches: [main]
    paths: [pubspec.yaml]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - name: Read version from pubspec.yaml
        id: ver
        run: |
          full=$(grep -E '^version:' pubspec.yaml | head -1 | awk '{print $2}')
          version=${full%%+*}
          tag="v$version"
          echo "full=$full"       >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag"         >> "$GITHUB_OUTPUT"
          echo "pubspec version $full -> tag $tag"
          if [[ "$GITHUB_REF_TYPE" == "tag" && "$GITHUB_REF_NAME" != "$tag" ]]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match pubspec version ($tag). Bump pubspec.yaml first."
            exit 1
          fi

      - name: Skip if release already exists
        id: check
        run: |
          if gh release view "${{ steps.ver.outputs.tag }}" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release ${{ steps.ver.outputs.tag }} already exists - nothing to do."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-java@v4
        if: steps.check.outputs.skip == 'false'
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        if: steps.check.outputs.skip == 'false'
        with:
          channel: stable
          flutter-version: 3.41.7
          cache: true

      - name: Test
        if: steps.check.outputs.skip == 'false'
        run: |
          flutter pub get
          flutter analyze
          flutter test

      - name: Build APK
        if: steps.check.outputs.skip == 'false'
        run: flutter build apk --release

      - name: Zip APK
        if: steps.check.outputs.skip == 'false'
        id: zip
        run: |
          mkdir -p dist
          name="transfeer-${{ steps.ver.outputs.tag }}.zip"
          (cd build/app/outputs/flutter-apk && zip -9 "$GITHUB_WORKSPACE/dist/$name" app-release.apk)
          unzip -l "dist/$name"
          echo "path=dist/$name" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release
        if: steps.check.outputs.skip == 'false'
        run: |
          tag="${{ steps.ver.outputs.tag }}"
          notes_file=release-notes.md
          # Notes come from the tag annotation if present, otherwise a default (Vietnamese: shown in the app).
          if [[ "$GITHUB_REF_TYPE" == "tag" ]] && git fetch --depth=1 origin "+refs/tags/$tag:refs/tags/$tag" 2>/dev/null \
             && [[ "$(git cat-file -t "$tag")" == "tag" ]]; then
            git tag -l --format='%(contents)' "$tag" > "$notes_file"
          fi
          if [[ ! -s "$notes_file" ]]; then
            echo "Phiên bản ${{ steps.ver.outputs.version }}" > "$notes_file"
          fi
          gh release create "$tag" "${{ steps.zip.outputs.path }}" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Transfeer $tag" \
            --notes-file "$notes_file"
